<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Your Machine</title>
<meta name="description" content="One more part of your machine, lit up." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   LA Reveal — "Your Machine"
   One accumulating page. State from ?week=N (1–5).
   Palette matches Coach Foundation: white, blue-led, gold pop.
   No build step, no backend, no storage. Vanilla only.
   ============================================================ */
:root{
  --brand:#18549f;        /* deep corporate blue (primary) */
  --brand-d:#103e77;      /* darker blue */
  --brand-2:#2858ff;      /* electric CTA blue */
  --brand-soft:#dbe6f4;   /* light blue ring */
  --brand-tint:#eef4fb;   /* very light blue surface */
  --gold:#efc319;         /* yellow/gold — the "unlock" pop, used sparingly */
  --gold-d:#b8900a;
  --gold-soft:#fbeeb6;
  --gold-tint:#fdf8e3;
  --green:#039855;        /* live / running */
  --ink:#0f1b33;          /* near-navy headings */
  --ink-2:#42506e;        /* body */
  --muted:#8893a8;        /* slate, from their palette */
  --line:#e6eaf1;
  --line-2:#d7deea;
  --bg:#f4f6fb;           /* light page background */
  --card:#ffffff;
  --wrap:#eef1f6;
  --radius:18px;
  --radius-s:12px;
  --shadow:0 1px 2px rgba(16,32,68,.04), 0 12px 32px -16px rgba(16,32,68,.16);
  --shadow-lift:0 2px 4px rgba(16,32,68,.06), 0 22px 48px -20px rgba(16,32,68,.24);
  --ease:cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  background:var(--bg);
  color:var(--ink);
  line-height:1.5;
  font-weight:400;
  -webkit-font-smoothing:antialiased;
  letter-spacing:-.01em;
}
.wrap{max-width:560px;margin:0 auto;padding:0 20px 64px}
.eyebrow{
  font-size:12.5px;font-weight:700;letter-spacing:.02em;color:var(--brand);
}
.muted{color:var(--muted)}

/* ---------- progress header ---------- */
.top{padding:32px 0 8px;text-align:center}
.top h1{font-size:13px;font-weight:600;color:var(--ink-2);letter-spacing:.01em;margin-bottom:4px}
.top .count{font-size:13px;color:var(--muted);font-weight:400}
.top .count b{color:var(--brand);font-weight:700}
.top .value{font-size:11.5px;color:var(--green);font-weight:700;margin-top:4px;letter-spacing:.01em}

/* ---------- machine pipeline ---------- */
.machine{
  margin:20px 0 8px;padding:22px 10px 18px;
  background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:var(--shadow);
}
.pipe{display:flex;align-items:flex-start;justify-content:space-between}
.stage{
  flex:1 1 0;display:flex;flex-direction:column;align-items:center;
  gap:8px;min-width:0;position:relative;
}
.node{
  width:46px;height:46px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  border:1.5px solid var(--line-2);background:#fbfcfe;color:var(--muted);
  transition:all .5s var(--ease);position:relative;z-index:2;
}
.node svg{width:21px;height:21px;stroke-width:1.9}
.stage .lbl{font-size:10.5px;line-height:1.25;text-align:center;color:var(--muted);font-weight:500;max-width:64px}
.stage .status{font-size:9px;font-weight:700;letter-spacing:.02em;min-height:11px}

.stage:not(:last-child)::after{
  content:"";position:absolute;top:23px;left:calc(50% + 27px);
  width:calc(100% - 54px);height:2px;background:var(--line-2);
  z-index:1;transition:background .5s var(--ease);border-radius:2px;
}

/* lit (past weeks) — settled into the blue system; clickable to revisit */
.stage.lit{text-decoration:none;color:inherit;cursor:pointer}
.stage.lit .node{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 6px 14px -6px rgba(24,84,159,.6)}
.stage.lit .lbl{color:var(--ink-2)}
.stage.lit .status{color:var(--green)}
.stage.conn::after{background:var(--brand)}
a.stage.lit:hover .node{transform:scale(1.08);box-shadow:0 8px 18px -6px rgba(24,84,159,.75)}
a.stage.lit:hover .lbl{color:var(--brand)}
a.stage.lit:focus-visible{outline:2px solid var(--brand);outline-offset:3px;border-radius:12px}

/* now (current week) — the gold pop = "just lit" */
.stage.now .node{background:var(--gold);border:2.5px solid var(--gold-d);color:#3a2c00;box-shadow:0 0 0 5px var(--gold-soft)}
.stage.now .lbl{color:var(--ink);font-weight:700}
.stage.now .status{color:var(--gold-d)}
.stage.now .node svg{animation:breathe 2.8s var(--ease) infinite}

/* wrapped (future) */
.stage.wrapped .node{border-style:dashed;background:#f3f5f9;color:#bcc4d4}
.stage.wrapped .lbl{color:#bcc4d4}
.stage.wrapped .status{color:#bcc4d4}

/* flowing dot on lit connectors */
.flow{position:absolute;top:20px;left:calc(50% + 27px);width:6px;height:6px;border-radius:50%;
  background:#fff;border:1.5px solid var(--brand);z-index:3;opacity:0;pointer-events:none}
.stage.conn .flow{animation:flow 1.8s linear infinite}

@keyframes breathe{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes flow{0%{opacity:0;transform:translateX(0)}12%{opacity:1}88%{opacity:1}100%{opacity:0;transform:translateX(calc(100% - 54px))}}
@media (prefers-reduced-motion: reduce){
  .stage.now .node svg{animation:none}
  .stage.conn .flow{animation:none;opacity:0}
}

/* ---------- this week's reveal ---------- */
.reveal{margin-top:26px;animation:rise .6s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.reveal{animation:none}}

/* celebration banner — the "bonus" moment */
.celebrate{display:flex;align-items:center;gap:12px;margin-bottom:18px;padding:14px 16px;border-radius:var(--radius-s);
  background:linear-gradient(135deg,#f9d65a 0%, var(--gold) 100%);color:#3a2c00;
  box-shadow:0 10px 26px -12px rgba(184,144,10,.7);animation:pop .5s var(--ease) both}
.celebrate .cic{flex:none;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.55);
  display:flex;align-items:center;justify-content:center;color:#7a5c00}
.celebrate .cic svg{width:19px;height:19px;fill:#7a5c00;stroke:none}
.celebrate .ct{font-size:14.5px;font-weight:800;letter-spacing:-.01em}
.celebrate .cs{font-size:12.5px;margin-top:1px;color:#5c4600}
@keyframes pop{0%{opacity:0;transform:scale(.94) translateY(6px)}60%{transform:scale(1.01)}100%{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.celebrate{animation:none}}

.reveal .eyebrow{display:block;margin-bottom:10px}
.reveal h2{font-size:26px;line-height:1.2;font-weight:800;letter-spacing:-.02em;color:var(--ink);margin-bottom:10px}
.reveal .sub{font-size:14.5px;line-height:1.55;color:var(--ink-2);margin-bottom:18px}

/* video slot */
.video{
  position:relative;width:100%;aspect-ratio:16/9;border-radius:var(--radius);overflow:hidden;
  background:radial-gradient(120% 120% at 50% 0%, #eef4fb 0%, #e2e9f3 100%);
  border:1px solid var(--line);box-shadow:var(--shadow);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.video .play{width:62px;height:62px;border-radius:50%;background:var(--card);display:flex;
  align-items:center;justify-content:center;box-shadow:var(--shadow-lift);transition:transform .25s var(--ease)}
.video .play svg{width:24px;height:24px;margin-left:3px;color:var(--brand-2);fill:var(--brand-2);stroke:none}
.video:hover .play{transform:scale(1.08)}
.video .cap{position:absolute;left:0;right:0;bottom:0;padding:14px 16px;font-size:12.5px;color:var(--ink-2);
  text-align:left;background:linear-gradient(180deg,transparent, rgba(255,255,255,.93) 55%)}
.video .badge{position:absolute;top:12px;left:12px;font-size:10.5px;font-weight:700;color:var(--brand);
  background:var(--brand-tint);border:1px solid var(--brand-soft);padding:4px 9px;border-radius:999px;letter-spacing:.02em}

/* what switched on */
.switched{margin-top:20px;display:flex;flex-direction:column;gap:10px}
.swcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-s);padding:14px 15px;
  display:flex;gap:12px;align-items:flex-start;box-shadow:var(--shadow);
  transition:transform .25s var(--ease), box-shadow .25s var(--ease)}
.swcard:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift)}
.swcard .ic{flex:none;width:34px;height:34px;border-radius:9px;background:var(--brand-tint);color:var(--brand);
  display:flex;align-items:center;justify-content:center}
.swcard .ic svg{width:18px;height:18px;stroke-width:2}
.swcard .t{font-size:14.5px;font-weight:700;letter-spacing:-.01em}
.swcard .s{font-size:12.5px;color:var(--muted);margin-top:2px}

/* price anchor strip — highlighted "value" treatment */
.anchor{margin-top:16px;display:flex;align-items:center;gap:12px;padding:13px 14px;
  background:linear-gradient(180deg,#fffdf6 0%, var(--gold-tint) 100%);
  border:1px solid var(--gold-soft);border-radius:var(--radius-s);
  box-shadow:0 1px 2px rgba(16,32,68,.04), 0 10px 26px -16px rgba(184,144,10,.45);
  position:relative;overflow:hidden}
.anchor::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gold)}
.anchor .logo{flex:none;width:42px;height:42px;border-radius:10px;background:#fff;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(16,32,68,.08)}
.anchor .logo img{width:26px;height:26px;object-fit:contain;display:block}
.anchor .atxt{flex:1;min-width:0}
.anchor .arep{font-size:13px;color:var(--ink-2);line-height:1.3}
.anchor .arep b{color:var(--ink);font-weight:800}
.anchor .aprice{font-size:12px;color:var(--gold-d);font-weight:700;margin-top:1px}
.anchor .pill{flex:none;font-size:10px;font-weight:800;color:#fff;background:var(--green);
  padding:4px 9px;border-radius:999px;letter-spacing:.03em;text-transform:uppercase;box-shadow:0 2px 6px rgba(3,152,85,.3)}

.contrast{margin-top:16px;font-size:13.5px;color:var(--ink-2);padding-left:13px;border-left:2px solid var(--brand)}

/* action / nothing-to-do */
.action{margin-top:20px;background:var(--brand-tint);border:1px solid var(--brand-soft);border-radius:var(--radius-s);padding:15px 16px}
.action .ah{font-size:13.5px;font-weight:700;margin-bottom:3px}
.action .as{font-size:12.5px;color:var(--ink-2)}
.action.calm{background:#eef1f6;border-color:var(--line)}
.action.calm .ah{color:var(--ink-2)}
.connect{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px}

.btn{display:inline-flex;align-items:center;gap:7px;font-family:inherit;font-size:13px;font-weight:600;
  letter-spacing:-.01em;cursor:pointer;border-radius:10px;padding:10px 15px;text-decoration:none;border:1px solid transparent;
  transition:transform .2s var(--ease), box-shadow .2s var(--ease), background .2s var(--ease)}
.btn svg{width:15px;height:15px;stroke-width:2}
.btn-brand{background:var(--brand-2);color:#fff}
.btn-brand:hover{transform:translateY(-2px);box-shadow:0 12px 26px -10px rgba(40,88,255,.7)}
.btn-line{background:var(--card);color:var(--ink);border-color:var(--line-2)}
.btn-line:hover{transform:translateY(-2px);border-color:var(--brand);color:var(--brand)}
.btn-gold{background:var(--gold);color:#3a2c00}
.btn-gold:hover{transform:translateY(-2px);background:#e4b80f;box-shadow:0 12px 26px -10px rgba(239,195,25,.8)}
.btn-block{width:100%;justify-content:center;padding:14px;font-size:14px}

.close{margin-top:22px;text-align:center;font-size:17px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
.close::before{content:"";display:block;width:28px;height:2px;background:var(--gold);border-radius:2px;margin:0 auto 16px}

/* ---------- section heads ---------- */
.shead{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:34px 0 12px}
.shead .shint{font-weight:600;text-transform:none;letter-spacing:0;color:var(--brand);opacity:.85}

/* ---------- the stack (past weeks) ---------- */
.stack{display:flex;flex-direction:column;gap:8px}
.trophy{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius-s);text-decoration:none;color:var(--ink);cursor:pointer;
  transition:transform .2s var(--ease), box-shadow .2s var(--ease), border-color .2s var(--ease)}
.trophy:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift);border-color:var(--brand-soft)}
.trophy .ic{flex:none;width:30px;height:30px;border-radius:8px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center}
.trophy .ic svg{width:16px;height:16px;stroke-width:2.2}
.trophy .nm{font-size:14px;font-weight:600;flex:1}
.trophy .run{font-size:11px;font-weight:700;color:var(--green);display:flex;align-items:center;gap:5px}
.trophy .run::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--green)}
.trophy .chev{flex:none;color:var(--muted);display:flex;align-items:center;transition:transform .2s var(--ease), color .2s var(--ease)}
.trophy .chev svg{width:16px;height:16px;stroke-width:2.2}
.trophy:hover .chev{color:var(--brand);transform:translateX(2px)}

/* ---------- wrapped rows (future weeks) ---------- */
.wrapped-rows{display:flex;flex-direction:column;gap:8px}
.wrow{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--wrap);border:1px dashed var(--line-2);border-radius:var(--radius-s)}
.wrow .ic{flex:none;width:30px;height:30px;border-radius:8px;background:#e1e6ef;color:#9aa3b6;display:flex;align-items:center;justify-content:center}
.wrow .ic svg{width:15px;height:15px;stroke-width:2}
.wrow .wtext{flex:1;min-width:0}
.wrow .nm{font-size:13px;font-weight:600;color:#7d8699}
.wrow .tease{font-size:11.5px;color:#9aa3b6;margin-top:1px}
.wrow .soon{flex:none;font-size:10.5px;font-weight:600;color:#aab2c4;letter-spacing:.02em}

/* ---------- runway / CTA ---------- */
.runway{margin-top:30px;border-radius:var(--radius);transition:all .3s var(--ease)}
.runway.whisper{padding:2px 0;text-align:center}
.runway.whisper a{font-size:12.5px;color:var(--muted);text-decoration:none;border-bottom:1px solid var(--line-2);padding-bottom:1px}
.runway.whisper a:hover{color:var(--brand);border-color:var(--brand)}
.runway.present{padding:18px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);text-align:center}
.runway.present .rt{font-size:14.5px;font-weight:600;margin-bottom:12px}
.runway.loud{padding:24px 20px;text-align:center;color:#fff;background:linear-gradient(155deg,#1c64b8 0%, #103e77 100%);box-shadow:var(--shadow-lift)}
.runway.loud .rt{font-size:19px;font-weight:800;letter-spacing:-.02em;margin-bottom:6px}
.runway.loud .rs{font-size:13px;color:#cfe0f3;margin-bottom:16px}

/* ---------- footer ---------- */
.foot{margin-top:34px;padding-top:20px;border-top:1px solid var(--line);text-align:center;font-size:12px;color:var(--muted);line-height:1.7}
.foot b{color:var(--ink-2);font-weight:600}

/* preview switcher — only shown when opened locally (file:// or localhost); hidden on the live site */
.preview{position:fixed;bottom:14px;left:14px;z-index:60;display:flex;align-items:center;gap:6px;
  background:rgba(15,27,51,.93);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;
  padding:7px 9px;border-radius:12px;box-shadow:0 12px 30px -8px rgba(0,0,0,.45);font-size:11px}
.preview b{font-weight:700;opacity:.6;font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;margin-right:2px}
.preview button{font-family:inherit;width:24px;height:24px;border-radius:7px;border:none;cursor:pointer;
  background:rgba(255,255,255,.14);color:#fff;font-weight:700;font-size:11px;transition:background .15s}
.preview button:hover{background:rgba(255,255,255,.28)}
.preview button.on{background:var(--gold);color:#3a2c00}
.preview button.wide{width:auto;padding:0 9px;font-weight:600}
.preview select{font-family:inherit;font-size:10px;border-radius:7px;border:none;padding:4px;
  background:rgba(255,255,255,.14);color:#fff;cursor:pointer}

/* back to top */
.b2t{position:fixed;bottom:18px;right:18px;width:42px;height:42px;border-radius:50%;background:var(--brand);color:#fff;
  border:none;cursor:pointer;opacity:0;visibility:hidden;transition:all .25s var(--ease);box-shadow:var(--shadow-lift);z-index:50;
  display:flex;align-items:center;justify-content:center}
.b2t svg{width:18px;height:18px;stroke-width:2.2}
.b2t.show{opacity:1;visibility:visible}
.b2t:hover{transform:translateY(-2px)}

@media (min-width:600px){
  .wrap{padding-top:8px}
  .node{width:52px;height:52px}
  .node svg{width:23px;height:23px}
  .stage:not(:last-child)::after{top:26px;left:calc(50% + 30px);width:calc(100% - 60px)}
  .flow{top:23px;left:calc(50% + 30px)}
  .stage .lbl{font-size:11.5px;max-width:80px}
  .reveal h2{font-size:32px}
}
</style>
</head>
<body>
  <main class="wrap">
    <header class="top">
      <h1>Your machine</h1>
      <div class="count"><b id="litCount">1</b> of 5 lit</div>
      <div class="value" id="value"></div>
      <div class="machine"><div class="pipe" id="pipe"></div></div>
    </header>

    <section class="reveal" id="reveal"><!-- rendered by JS --></section>

    <div id="stackWrap" hidden>
      <div class="shead">Already running <span class="shint">· tap to revisit</span></div>
      <div class="stack" id="stack"></div>
    </div>

    <div id="wrappedWrap" hidden>
      <div class="shead">Opening soon</div>
      <div class="wrapped-rows" id="wrapped"></div>
    </div>

    <section id="runway"></section>

    <footer class="foot" id="foot"></footer>
  </main>

  <button class="b2t" aria-label="Back to top" id="b2t">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
  </button>

<script>
/* ===================== icons (inline SVG, no emoji) ===================== */
const ICON = {
  power:'<path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.8 0"/>',
  signal:'<path d="M4 11a9 9 0 0 1 9 9"/><path d="M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1"/>',
  magnet:'<path d="m6 15-4-4 6.8-6.8a7.8 7.8 0 0 1 11 11L13 22l-4-4 6.4-6.4a2.1 2.1 0 0 0-3-3L6 15"/><path d="m5 8 4 4"/><path d="m12 15 4 4"/>',
  calendar:'<rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="M8 2v4"/><path d="M16 2v4"/>',
  coin:'<circle cx="12" cy="12" r="10"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 18V6"/>',
  lock:'<rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  play:'<path d="M8 5v14l11-7z"/>',
  globe:'<circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20"/>',
  bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/>',
  tag:'<path d="M12.6 2.6a2 2 0 0 0-1.4-.6H4a2 2 0 0 0-2 2v7.2a2 2 0 0 0 .6 1.4l8.8 8.8a2 2 0 0 0 2.8 0l6.4-6.4a2 2 0 0 0 0-2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/>',
  spark:'<path d="M12 2l2.2 6.1L20 10l-5.8 1.9L12 18l-2.2-6.1L4 10l5.8-1.9z"/><path d="M19 14l.8 2.2L22 17l-2.2.8L19 20l-.8-2.2L16 17l2.2-.8z"/>',
  chevron:'<path d="m9 18 6-6-6-6"/>'
};
function svg(name,extra){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"'+(extra||'')+'>'+ICON[name]+'</svg>';}

/* ===================== GHL deep-links (W1) ===================== */
/* Merge fields resolve only when the page is served inside GHL. */
const GHL='https://app.coachfoundation.com';
const LINK={
  social:GHL+'/v2/location/{{location.id}}/marketing/social-planner',
  calendar:GHL+'/v2/location/{{location.id}}/settings/calendars/preferences',
  payment:GHL+'/v2/location/{{location.id}}/payments/integrations',
  dash:GHL
};

const ANCHOR={
  1:{name:'ClickFunnels',plan:'Scale',price:197,logo:LOGO.clickfunnels},
  2:{name:'Hootsuite',plan:'Standard',price:99,logo:LOGO.hootsuite},
  3:{name:'ActiveCampaign',plan:'Professional',price:149,logo:LOGO.activecampaign},
  4:{name:'Acuity Scheduling',plan:'Premium',price:61,logo:LOGO.acuity},
  5:{name:'Kajabi',plan:'Growth',price:249,logo:LOGO.kajabi}
};
function cumValue(wk){let s=0;for(let i=1;i<=wk;i++)s+=ANCHOR[i].price;return s;}

/* celebration moments — the "bonus" layer, fired by a real event via ?celebrate=KEY.
   v1 also goes out by email/SMS; this lights an on-page badge when the link carries the flag. */
const CELEBRATE={
  'first-post':{title:'Your first post just went out.',sub:'The machine’s doing the showing-up for you now.'},
  'first-lead':{title:'Your first lead just came in.',sub:'Your follow-up is already chasing them — no action needed.'},
  'tenth-lead':{title:'10 leads in. The machine’s humming.',sub:'Every one of them is being followed up for you.'},
  'first-call':{title:'Your first call is booked.',sub:'Reminders are set, so they actually show.'},
  'first-sale':{title:'You just got paid.',sub:'Real money ran through your own account. That’s the whole machine, complete.'}
};

/* hints for wrapped (future) weeks — a teaser of what's coming, not the full reveal */
const HINT={
  2:{name:'Get seen',tease:'A post scheduler that puts your content out for you.'},
  3:{name:'Catch the leads',tease:'An auto follow-up that chases every lead for you.'},
  4:{name:'Book the calls',tease:'A self-booking link + no-show reminders.'},
  5:{name:'Get paid',tease:'Your own low-ticket course, built for you.'}
};

/* ===================== render ===================== */
const PARAMS=new URLSearchParams(location.search);
function clampWk(n){return (Number.isInteger(n)&&n>=1&&n<=5)?n:null;}
/* week = the page they're viewing; unlocked = furthest week they've reached.
   The weekly email sets ?week=N (unlocked defaults to N → forward stays locked).
   Once complete, the link carries ?unlocked=5 → every stage is freely navigable. */
const week=clampWk(parseInt(PARAMS.get('week'),10))||1;
let unlocked=clampWk(parseInt(PARAMS.get('unlocked'),10))||week;
if(unlocked<week) unlocked=week;
function navHref(w){return '?week='+w+'&unlocked='+unlocked;}

document.getElementById('litCount').textContent=unlocked;
document.getElementById('value').textContent='≈ $'+cumValue(unlocked)+'/mo of tools, switched on';

/* machine pipeline */
(function(){
  const pipe=document.getElementById('pipe');
  pipe.innerHTML=STAGES.map(st=>{
    let cls='stage', status='', mark=svg(st.icon), lbl=st.short, tag='div', attrs='';
    if(st.wk<unlocked) cls+=' conn';            /* active connector to the next unlocked stage */
    if(st.wk===week){ cls+=' now'; status=(week===unlocked)?'just unlocked':'you’re here'; }
    else if(st.wk<=unlocked){ cls+=' lit'; status='running';
      tag='a'; attrs=' href="'+navHref(st.wk)+'" title="Go to Week '+st.wk+'"'; }
    else { cls+=' wrapped'; status=' '; mark=svg('lock'); lbl='Opening soon'; }
    return '<'+tag+' class="'+cls+'"'+attrs+'><div class="node">'+mark+'</div><div class="lbl">'+lbl+'</div><div class="status">'+status+'</div><div class="flow"></div></'+tag+'>';
  }).join('');
})();

/* this week's reveal */
(function(){
  const w=WEEKS[week];
  let html='';
  const cel=new URLSearchParams(location.search).get('celebrate');
  if(cel && CELEBRATE[cel]){
    const c=CELEBRATE[cel];
    html+='<div class="celebrate"><div class="cic">'+svg('spark')+'</div>'
        + '<div class="ctxt"><div class="ct">'+c.title+'</div><div class="cs">'+c.sub+'</div></div></div>';
  }
  html+='<span class="eyebrow">'+w.eyebrow+'</span>';
  html+='<h2>'+w.headline+'</h2>';
  html+='<p class="sub">'+w.sub+'</p>';
  html+='<div class="video" role="button" tabindex="0" aria-label="Watch it work">'
      + '<span class="badge">Watch it work · 90s</span>'
      + '<span class="play">'+svg('play','')+'</span>'
      + '<span class="cap">'+w.cap+'</span></div>';
  html+='<div class="switched">';
  w.on.forEach(c=>{
    html+='<div class="swcard"><div class="ic">'+svg(c.ic)+'</div><div><div class="t">'+c.t+'</div>'+(c.s?'<div class="s">'+c.s+'</div>':'')+'</div></div>';
  });
  html+='</div>';
  const an=ANCHOR[week];
  html+='<div class="anchor">'
      + '<div class="logo"><img src="'+an.logo+'" alt="'+an.name+' logo" loading="lazy" /></div>'
      + '<div class="atxt"><div class="arep">Replaces <b>'+an.name+'</b></div>'
      + '<div class="aprice">$'+an.price+'/mo elsewhere</div></div>'
      + '<div class="pill">Included free</div></div>';

  if(w.contrast) html+='<div class="contrast">'+w.contrast+'</div>';
  const a=w.action;
  if(a.type==='connect'){
    html+='<div class="action"><div class="ah">'+a.h+'</div><div class="as">'+a.s+'</div><div class="connect">'
        + '<a class="btn btn-brand" href="'+LINK.social+'" target="_blank" rel="noopener">'+svg('signal')+'Social</a>'
        + '<a class="btn btn-line" href="'+LINK.calendar+'" target="_blank" rel="noopener">'+svg('calendar')+'Calendar</a>'
        + '<a class="btn btn-line" href="'+LINK.payment+'" target="_blank" rel="noopener">'+svg('coin')+'Payment</a>'
        + '<a class="btn btn-line" href="'+LINK.dash+'" target="_blank" rel="noopener">'+svg('globe')+'Web address</a>'
        + '</div></div>';
  } else if(a.type==='none'){
    html+='<div class="action calm"><div class="ah">'+a.h+'</div>'+(a.s?'<div class="as">'+a.s+'</div>':'')+'</div>';
  }
  html+='<div class="close">'+w.close+'</div>';
  document.getElementById('reveal').innerHTML=html;
})();

/* the stack — every OTHER unlocked week (navigable), not the one being viewed */
(function(){
  let html='';
  for(let i=1;i<=5;i++){
    if(i>unlocked || i===week) continue;
    const st=STAGES[i-1];
    html+='<a class="trophy" href="'+navHref(i)+'" title="Go to Week '+i+'">'
        + '<div class="ic">'+svg(st.icon)+'</div>'
        + '<div class="nm">'+STACK_NAME[i]+'</div>'
        + '<div class="run">running</div>'
        + '<div class="chev">'+svg('chevron')+'</div></a>';
  }
  if(!html) return;
  document.getElementById('stack').innerHTML=html;
  document.getElementById('stackWrap').hidden=false;
})();

/* wrapped rows — only the still-locked weeks (a hint of what's coming) */
(function(){
  let html='';
  for(let i=unlocked+1;i<=5;i++){
    const st=STAGES[i-1], h=HINT[i];
    html+='<div class="wrow"><div class="ic">'+svg(st.icon)+'</div>'
        + '<div class="wtext"><div class="nm">Week '+i+' · '+h.name+'</div><div class="tease">'+h.tease+'</div></div>'
        + '<div class="soon">opening soon</div></div>';
  }
  if(!html) return;
  document.getElementById('wrapped').innerHTML=html;
  document.getElementById('wrappedWrap').hidden=false;
})();

/* runway — escalating CTA toward the call */
(function(){
  const r=document.getElementById('runway');
  if(week<=2){
    r.className='runway whisper';
    r.innerHTML='<a href="'+BOOK+'" target="_blank" rel="noopener">Talk to us when you’re ready</a>';
  } else if(week<=4){
    r.className='runway present';
    r.innerHTML='<div class="rt">When you want a hand taking this further, we’re here.</div><a class="btn btn-brand" href="'+BOOK+'" target="_blank" rel="noopener">'+svg('calendar')+'Book your call</a>';
  } else {
    r.className='runway loud';
    r.innerHTML='<div class="rt">Want us to build this for real?</div><div class="rs">Your offer, your course, your checkout — done for you.</div><a class="btn btn-gold btn-block" href="'+BOOK+'" target="_blank" rel="noopener">'+svg('calendar')+'Book your call</a>';
  }
})();

/* footer */
(function(){
  const next=(unlocked<5)?'Next light-up lands next week.':'That’s the full machine — lit end to end.';
  document.getElementById('foot').innerHTML='<b>Included in what you already pay.</b><br>'+next;
})();

/* video slot — placeholder click (swap for <video>/embed later) */
document.addEventListener('click',e=>{
  const v=e.target.closest('.video');
  if(v) v.querySelector('.play').animate([{transform:'scale(1)'},{transform:'scale(.9)'},{transform:'scale(1.08)'}],{duration:260});
});

/* preview switcher — local only (file:// or localhost). Never renders on a real domain. */
(function(){
  const local = location.protocol==='file:' || ['localhost','127.0.0.1'].includes(location.hostname);
  if(!local) return;
  const allUnlocked = PARAMS.get('unlocked')==='5';
  const bar=document.createElement('div');
  bar.className='preview';
  let h='<b>Preview</b>';
  for(let i=1;i<=5;i++) h+='<button data-wk="'+i+'" class="'+(i===week?'on':'')+'">'+i+'</button>';
  h+='<button data-free class="wide '+(allUnlocked?'on':'')+'" title="Unlock every stage (the completed, free-navigation state)">Free-nav</button>';
  h+='<select id="pvCel" title="Celebration event"><option value="">no event</option>';
  for(const k in CELEBRATE) h+='<option value="'+k+'">'+k+'</option>';
  h+='</select>';
  bar.innerHTML=h;
  document.body.appendChild(bar);
  const sel=bar.querySelector('#pvCel'); if(PARAMS.get('celebrate')) sel.value=PARAMS.get('celebrate');
  function go(w,all){
    const u=new URL(location); u.searchParams.set('week',w);
    all ? u.searchParams.set('unlocked','5') : u.searchParams.delete('unlocked');
    sel.value ? u.searchParams.set('celebrate',sel.value) : u.searchParams.delete('celebrate');
    location.href=u;
  }
  bar.addEventListener('click',e=>{
    const wk=e.target.closest('button[data-wk]'); if(wk){ go(wk.dataset.wk, allUnlocked); return; }
    const fr=e.target.closest('button[data-free]'); if(fr){ go(week, !allUnlocked); return; }
  });
  sel.addEventListener('change',()=>go(week, allUnlocked));
})();

/* back to top */
const b2t=document.getElementById('b2t');
addEventListener('scroll',()=>b2t.classList.toggle('show',scrollY>300));
b2t.addEventListener('click',()=>scrollTo({top:0,behavior:'smooth'}));
</script>
</body>
</html>
